axelera-model-format: 1.0.0

name: yolov8n-rtmpose-m

description: >
  Cascade pipeline: YOLOv8n person detector (3 AIPU cores) → RTMPose-M
  pose estimation (1 AIPU core). RTMPose uses SimCC coordinate regression
  (not heatmaps) — fully trained, AP ~71.5 on COCO val2017.
  Native C++ GStreamer decoder (libdecode_rtmpose.so), no Python decode needed.

pipeline:
  - person_detection:
      model_name: yolov8n-coco-onnx
      template_path: $AXELERA_FRAMEWORK/pipeline-template/yolo-letterbox.yaml
      input:
        type: image
      postprocess:
        - decodeyolo:
            box_format: xywh
            normalized_coord: False
            max_nms_boxes: 30000
            conf_threshold: 0.25
            nms_iou_threshold: 0.45
            nms_class_agnostic: True
            nms_top_k: 300
            use_multi_label: False
            label_filter: [person]

  - pose_estimation:
      model_name: rtmpose-m-coco-onnx
      input:
          type: image
          color_format: RGB
          source: roi
          where: person_detection
          which: AREA
          top_k: 5
          min_width: 40
          min_height: 60
      preprocess:
        - resize:
            width: 192
            height: 256
        - torch-totensor:
        - normalize:
            mean: 0.485, 0.456, 0.406
            std: 0.229, 0.224, 0.225
      postprocess:
        - decodertmpose:
            conf_threshold: 0.3
            simcc_head_onnx: $AXELERA_FRAMEWORK/customers/heatmap_pose/rtmpose-m-simcc-head.onnx

operators:
  decodeyolo:
    class: DecodeYolo
    class_path: $AXELERA_FRAMEWORK/ax_models/decoders/yolo.py
  decodertmpose:
    class: DecodeRTMPose
    class_path: $AXELERA_FRAMEWORK/customers/heatmap_pose/decode_rtmpose.py

models:
  yolov8n-coco-onnx:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: weights/yolov8n_ultralytics_v8.1.0.onnx
    weight_url: https://media.axelera.ai/artifacts/model_cards/weights/yolo/object_detection/yolov8n_ultralytics_v8.1.0.onnx
    weight_md5: 2ec6c50f5cb0e059344f4ea7f72a3c41
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 80
    dataset: CocoDataset-COCO2017
    extra_kwargs:
      aipu_cores: 3
      compilation_config:
        split_buffer_promotion: true
        tiling_depth: 6

  rtmpose-m-coco-onnx:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: $AXELERA_FRAMEWORK/customers/heatmap_pose/rtmpose-m-256x192-backbone.onnx
    task_category: KeypointDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 256, 192]
    input_color_format: RGB
    num_classes: 1
    dataset: CocoDataset-keypoint-COCO2017
    extra_kwargs:
      aipu_cores: 1
      compilation_config:
        split_buffer_promotion: true
        tiling_depth: 6

datasets:
  CocoDataset-COCO2017:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names
    label_type: COCO2017

  CocoDataset-keypoint-COCO2017:
    class: KptDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco
    label_type: COCO2017
